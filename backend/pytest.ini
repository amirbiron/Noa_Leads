[pytest]
asyncio_mode = auto
# מכבים את plugin anyio (נכנס כתלות טרנזיטיבית של anthropic/httpx) — הוא מתנגש
# עם pytest-asyncio (asyncio_mode=auto) ושובר את חיבור asyncpg בבדיקות DB
# אסינכרוניות ("another operation is in progress"). אנחנו משתמשים בלעדית
# ב-pytest-asyncio. anyio כספרייה נשאר זמין; רק ה-pytest plugin שלו מושבת.
addopts = -p no:anyio
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
