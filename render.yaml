# הגדרת שירותים ל-Render — שלד ראשוני
# Cron jobs יתווספו בשלב 6 כשהם ייכנסו לקוד.

databases:
  - name: noa-leads-db
    plan: starter
    databaseName: noa_leads
    user: noa_leads

services:
  # ===== Backend (FastAPI) =====
  - type: web
    name: noa-leads-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ===== Frontend (Next.js) =====
  - type: web
    name: noa-leads-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
