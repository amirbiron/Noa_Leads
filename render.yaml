# הגדרת שירותים ל-Render.
# כל ה-cron jobs חולקים envVarGroup אחד כדי לא לכפול secrets.
# שעות ה-cron הן ב-UTC; הסכימה אומרת ~19:00 ישראל (16:00 UTC, מתאים לקיץ).

envVarGroups:
  - name: noa-leads-shared
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
  # קבוצה משותפת לכל service שנוגע ב-Google OAuth / DB-stored tokens /
  # webhook URLs. המתאם מזין את הערכים *פעם אחת* ב-Render dashboard,
  # והם מתפזרים אוטומטית ל-web + ל-cron services הרלוונטיים. בלי
  # ה-group הזה, כל ייצור cron חדש חייב הזנה ידנית של 8 vars — drift
  # שכבר נשרף עליו פעמיים (GOOGLE_* + SECRETS_ENCRYPTION_KEY חסרים
  # בcron, 05-06/2026). ראה: recurring-bug-patterns Pattern 5 Variant 5c.
  - name: noa-leads-google
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: GMAIL_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_PUBSUB_SERVICE_ACCOUNT
        sync: false
      # Fernet key — חייב פורמט ספציפי (32 bytes URL-safe base64, 44 תווים).
      # ייצור ידני: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: SECRETS_ENCRYPTION_KEY
        sync: false
      - key: BACKEND_URL
        sync: false
  - name: noa-leads-python
    # ננעל Python ל-3.12.7 — ברירת המחדל של Render (כיום 3.14) היא beta
    # שאין לה prebuilt wheels ל-pydantic-core; הbuild נופל ב-Rust compile.
    # קיים גם backend/.python-version כ-fallback.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: noa-leads-db
    # plan: starter עבור Postgres הוא instance type מסוג legacy שלא ניתן
    # יותר ליצור איתו DBs חדשים (קיימים ממשיכים לרוץ). השמות הנוכחיים
    # הם kebab-case. plan: basic-256mb תקף ועולה ~$6/חודש (256MB RAM,
    # 1GB אחסון) — מספיק ל-MVP של נועה. אופציית שדרוג: basic-1gb.
    # הערה: עבור web/cron services "starter" *כן* תקף עדיין — ראה למטה.
    plan: basic-256mb
    databaseName: noa_leads
    user: noa_leads

services:
  # ===== Backend (FastAPI) =====
  - type: web
    name: noa-leads-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # רץ פעם אחת בכל deploy לפני שה-startCommand עולה. אם נכשל — ה-deploy
    # נעצר וה-version הישנה ממשיכה לרוץ (אין downtime). Alembic idempotent
    # אז אפשר להריץ שוב ושוב בבטחה.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Google OAuth + Gmail + SECRETS_ENCRYPTION_KEY + BACKEND_URL —
      # כולם דרך ה-group כדי שהם יזרמו אוטומטית גם ל-cron services
      # שדורשים אותם (renew_calendar_watch, renew_gmail_watch,
      # retry_pending_classification). ראה: envVarGroups.noa-leads-google.
      - fromGroup: noa-leads-google
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # ===== Frontend (Next.js) =====
  - type: web
    name: noa-leads-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  # ===== Cron jobs =====

  # סימון לידים שעבר הפולואפ שלהם — כל 15 דקות
  - type: cron
    name: noa-mark-overdue
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.mark_overdue
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # זיהוי הצעות תקועות + יצירת משימת פולואפ — כל שעה
  - type: cron
    name: noa-check-stuck-proposals
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "5 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.check_stuck_proposals
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # warm_followup — Spec §17.1, F-08. כל שעה, ב-15 דק' (מפזר מ-stuck_proposals
  # שרץ ב-:05). יוצר warm_followup לליד IN_PROGRESS עם last_outbound_at <=
  # now-48h, בלי inbound, בלי שום task פתוח (idempotent).
  - type: cron
    name: noa-check-warm-followups
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "15 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.check_warm_followups
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # זיהוי לידים רדומים — פעם ביום ב-03:00 ישראל (00:00 UTC)
  - type: cron
    name: noa-detect-dormant
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 0 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.detect_dormant
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # הצעת פעולה AI ללידים רדומים (§19 D.1) — אחרי detect-dormant. 00:15 UTC.
  - type: cron
    name: noa-suggest-dormant
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "15 0 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.suggest_dormant_actions
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # סיכום יומי לטלגרם — 19:00 ישראל (16:00 UTC, IDT קיץ)
  - type: cron
    name: noa-daily-summary
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 16 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.daily_summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # סיכום שבועי — יום ראשון 08:00 ישראל (05:00 UTC)
  - type: cron
    name: noa-weekly-summary
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 5 * * 0"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.weekly_summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # צילום "מצב פתוח בסוף השבוע" — שבת 22:30 UTC
  # = Sunday 01:30 IDT (קיץ) / Sunday 00:30 IST (חורף). חייב לרוץ
  # *אחרי* `capture_time` שהוא Sun 00:00 IL בשתי העונות (cursor Finding 2
  # על da8b9c8 — לפני התיקון הזה: ה-cron בחורף רץ Sat 23:00 IST, שעה
  # *לפני* capture_time, וה-DB לא שיקף את ה-state בחצות ראשון).
  # ה-snapshot נצרך ע"י jobs.weekly_summary שרץ ראשון 08:00 → נכתב לפניו.
  # סוגר 7 ממצאי cursor bugbot על שחזור from-mutable-fields ב-_open_state.
  - type: cron
    name: noa-capture-weekly-open-state
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "30 22 * * 6"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.capture_weekly_open_state
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # post-meeting check — כל 30 דק' (Spec §11.4 + §23, F-15)
  # יוצר משימת post_meeting_update לפגישות שהסתיימו לפני 30+ דק'.
  # אינדמפוטנטי דרך NOT EXISTS לפי booking_id.
  - type: cron
    name: noa-post-meeting-tasks
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.post_meeting_tasks
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # ניקוי bookings תקועים + reset של ליד תקוע ב-BOOKING_PENDING/BOOKED — יומי 03:30 ישראל (00:30 UTC, F-13)
  - type: cron
    name: noa-expire-stale-bookings
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "30 0 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.expire_stale_bookings
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # חידוש watch channel של Google Calendar (תוקף ~שבוע) — יומי 04:00 ישראל (01:00 UTC, F-13)
  # ה-job מפענח tokens מ-DB (SECRETS_ENCRYPTION_KEY), מרענן access token
  # (GOOGLE_CLIENT_ID/SECRET), ורושם webhook URL חזרה ל-backend (BACKEND_URL).
  # כל ה-vars האלה ב-noa-leads-google group, כך שערכים מסונכרנים אוטומטית
  # עם web — אין יותר drift ידני (תוקן 06/2026 אחרי שהגישה הקודמת sync:false
  # per-cron גרמה לחיבור של נועה להישבר ב-31/05).
  - type: cron
    name: noa-renew-calendar-watch
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 1 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.renew_calendar_watch
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-google
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # חידוש watch channel של Gmail (תוקף ~7 ימים) — יומי 05:00 ישראל (02:00 UTC).
  # Phase 3 Stage 17. כל ה-vars (GOOGLE_*, GMAIL_*, SECRETS_ENCRYPTION_KEY)
  # ב-noa-leads-google group, מסונכרנים עם web. אם topic לא מוגדר ב-DB —
  # דילוג שקט (DB-side default).
  - type: cron
    name: noa-renew-gmail-watch
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 2 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.renew_gmail_watch
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-google
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python

  # retry של email_messages שסיווג AI שלהם נכשל (Phase 3 Stage 18 commit 4/4, F-16).
  # רץ כל דקה (Spec §23). מטפל ב-AIRateLimitError ו-AIError שדחו את הclassify
  # ב-webhook הראשי — כל ריצה לוקחת batch של עד 10 רשומות. אחרי
  # AI_MAX_CLASSIFICATION_RETRIES ניסיונות נוצר ליד עם manual_review_needed=True.
  # דורש: ANTHROPIC_API_KEY (shared) + Google OAuth + SECRETS_ENCRYPTION_KEY,
  # הכל ב-noa-leads-google group.
  - type: cron
    name: noa-retry-pending-classification
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "* * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m jobs.retry_pending_classification
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: noa-leads-db
          property: connectionString
      - fromGroup: noa-leads-google
      - fromGroup: noa-leads-shared
      - fromGroup: noa-leads-python
      # AI_MODEL_* envs יורשים defaults מ-config.py אם לא מוגדרים.
      # AI_CLASSIFY_CONFIDENCE_THRESHOLD, AI_MAX_CLASSIFICATION_RETRIES,
      # AI_FILTER_LABEL_NAME גם defaults — אם מתאם רוצה לכוונן אחרי deploy,
      # יוסיף ידנית ב-Render UI.
